<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM Pro - Gestão e Programação Semanal de Manutenção</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
        .drag-over { border: 2px dashed #0284c7 !important; background-color: rgba(2, 132, 199, 0.08) !important; }
        .dragging { opacity: 0.5; transform: scale(0.98); }

        /* Estilos Exclusivos para Impressão em PDF */
        @media print {
            body * { visibility: hidden; }
            #printable-os, #printable-os * { visibility: visible; }
            #printable-os {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
                padding: 20px;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen flex flex-col custom-scrollbar">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-tr from-amber-500 to-sky-600 p-2.5 rounded-xl shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-bolt text-yellow-300 text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                                ELÉTRICA INFRA <span class="text-xs bg-sky-500/20 text-sky-400 font-semibold px-2 py-0.5 rounded-full border border-sky-500/30">Programação Semanal</span>
                            </h1>
                            <div class="flex items-center gap-1.5 ml-1">
                                <span id="status-cloud-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" id="status-cloud-dot"></span>
                                    <i class="fa-solid fa-cloud text-[11px]" id="status-cloud-icon"></i>
                                    <span id="status-cloud-text">Nuvem Conectada</span>
                                </span>
                                <span id="status-mode-badge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                                    <i class="fa-solid fa-server text-[9px]"></i>
                                    <span id="status-mode-text">Modo Nuvem</span>
                                </span>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">Gestão e Painel Integrado de Ordens de Serviço</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 bg-slate-950/80 p-2 rounded-xl border border-slate-800 text-center text-xs">
                    <div class="p-2 rounded-lg bg-slate-900/80">
                        <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Programadas</span>
                        <span id="kpi-global-prog" class="text-lg font-bold text-sky-400">0</span>
                    </div>
                    <div class="p-2 rounded-lg bg-slate-900/80">
                        <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Concluídas</span>
                        <span id="kpi-global-conc" class="text-lg font-bold text-emerald-400">0</span>
                    </div>
                    <div class="p-2 rounded-lg bg-slate-900/80">
                        <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Pendentes</span>
                        <span id="kpi-global-pend" class="text-lg font-bold text-amber-400">0</span>
                    </div>
                    <div class="p-2 rounded-lg bg-slate-900/80">
                        <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Total HH Real</span>
                        <span id="kpi-global-horas" class="text-lg font-bold text-indigo-400">0 HH</span>
                    </div>
                    <div class="p-2 rounded-lg bg-slate-900/80 col-span-2 sm:col-span-1">
                        <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Aderência %</span>
                        <span id="kpi-global-efic" class="text-lg font-bold text-sky-300">0%</span>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="btn-nova-os" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-2 rounded-lg font-medium text-xs sm:text-sm flex items-center gap-1.5 transition shadow-lg shadow-sky-600/20 active:scale-95">
                        <i class="fa-solid fa-plus text-xs"></i> Nova OS
                    </button>
                    <button id="btn-export-csv" title="Exportar Relatório CSV" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg text-sm border border-slate-700 transition">
                        <i class="fa-solid fa-file-csv text-emerald-400"></i>
                    </button>
                    <button id="btn-export-json" title="Exportar Backup JSON" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg text-sm border border-slate-700 transition">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <label title="Importar Backup JSON" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg text-sm border border-slate-700 cursor-pointer transition">
                        <i class="fa-solid fa-upload"></i>
                        <input type="file" id="input-import-json" accept=".json" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </header>

    <section class="bg-slate-900/80 border-b border-slate-800 px-4 py-3 sticky top-[69px] z-20 backdrop-blur-md no-print">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
            <div class="flex p-1 bg-slate-950 rounded-lg border border-slate-800 self-start md:self-auto">
                <button id="tab-semanal" class="px-4 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-2 bg-sky-600 text-white shadow">
                    <i class="fa-solid fa-calendar-week"></i> Agenda Semanal
                </button>
                <button id="tab-status" class="px-4 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-list-check"></i> Visão por Status
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-2 flex-1 max-w-3xl justify-end">
                <div class="relative flex-1 min-w-[160px] max-w-xs">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="filter-search" placeholder="Buscar OS, Tag, Atividade..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 placeholder-slate-500">
                </div>
                <select id="filter-tecnico" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="">Todos os Técnicos</option>
                </select>
                <select id="filter-prioridade" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="">Todas Prioridades</option>
                    <option value="Crítica">Crítica</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
                <select id="filter-tipo" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="">Todos os Tipos</option>
                    <option value="Preventiva">Preventiva</option>
                    <option value="Corretiva">Corretiva</option>
                    <option value="Preditiva">Preditiva</option>
                    <option value="Melhoria">Melhoria</option>
                    <option value="Inspeção">Inspeção/5S</option>
                </select>
                <button id="btn-limpar-filtros" title="Limpar Filtros" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 border border-slate-700">
                    <i class="fa-solid fa-filter-circle-xmark"></i>
                </button>
            </div>
        </div>
    </section>

    <main class="flex-1 p-4 overflow-x-auto no-print">
        <div id="board-container" class="flex gap-4 min-w-max pb-4 items-start"></div>
    </main>

    <!-- Modal Form -->
    <div id="modal-os" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto no-print">
        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl w-full max-w-3xl overflow-hidden my-8">
            <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-800 bg-slate-950">
                <h3 id="modal-title" class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-file-pen text-sky-400"></i> Cadastrar Nova Ordem de Serviço
                </h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="form-os" class="p-5 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
                <input type="hidden" id="os-id">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Nº OS / Código *</label>
                        <input type="text" id="os-numero" required placeholder="OS-2026-001" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tag do Equipamento / Área</label>
                        <input type="text" id="os-tag" placeholder="ÁREA C / EQP-BOMBA-02" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <!-- Campo Designar Técnico Programado (Caixas Selecionáveis / Checkboxes + Adicionar) -->
                <div class="border border-slate-800 bg-slate-950/80 p-3 rounded-lg space-y-2">
                    <label class="block text-xs font-semibold text-slate-300">
                        <i class="fa-solid fa-user-gear text-sky-400 mr-1"></i> Técnico(s) Programado(s) / Designado(s) *
                    </label>
                    <div id="tecnicos-programados-checkboxes" class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-1">
                        <!-- Renderizado via JS -->
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-slate-800/80 mt-2">
                        <input type="text" id="input-novo-tecnico-preset" placeholder="Adicionar outro técnico..." class="flex-1 bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                        <button type="button" id="btn-add-novo-tecnico-preset" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded text-xs font-medium border border-slate-700 transition">
                            <i class="fa-solid fa-plus mr-1"></i> Adicionar
                        </button>
                    </div>
                </div>

                <!-- Seção: Múltiplos Técnicos na Execução -->
                <div class="border border-slate-800 bg-slate-950/60 p-3 rounded-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-users-gear text-sky-400"></i> Apontamento de Execução por Técnico
                        </label>
                        <div class="flex items-center gap-3">
                            <span id="executantes-count-badge" class="text-[11px] font-semibold text-sky-400 bg-sky-950/60 px-2 py-0.5 rounded border border-sky-800/50">0 Executantes</span>
                            <span id="hh-preview-modal" class="text-[11px] font-mono text-indigo-300 font-bold bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">0.0 HH Totais</span>
                        </div>
                    </div>

                    <div id="tecnicos-execucao-container" class="space-y-2"></div>

                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-2">
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end">
                            <div class="sm:col-span-4">
                                <label class="block text-[10px] text-slate-400 mb-1 font-semibold">Técnico Executante</label>
                                <select id="select-tec-preset" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500 mb-1">
                                    <option value="">-- Selecionar da Lista --</option>
                                </select>
                                <input type="text" id="input-tec-nome" placeholder="Ou digite o nome manual..." class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                            </div>

                            <div class="sm:col-span-3">
                                <label class="block text-[10px] text-slate-400 mb-1 font-semibold">Início</label>
                                <input type="datetime-local" id="input-tec-inicio" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-[11px] text-slate-100 focus:outline-none focus:border-sky-500">
                            </div>

                            <div class="sm:col-span-3">
                                <label class="block text-[10px] text-slate-400 mb-1 font-semibold">Fim</label>
                                <input type="datetime-local" id="input-tec-fim" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-[11px] text-slate-100 focus:outline-none focus:border-sky-500">
                            </div>

                            <div class="sm:col-span-2">
                                <button type="button" id="btn-add-tecnico-exec" class="w-full bg-sky-600 hover:bg-sky-500 text-white rounded px-2 py-1.5 text-xs font-medium transition flex items-center justify-center gap-1 shadow">
                                    <i class="fa-solid fa-plus text-[10px]"></i>
                                    <span>Adicionar</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Título da Atividade *</label>
                    <input type="text" id="os-titulo" required placeholder="ACOMPANHAMENTO EMPRESA FOCO" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Descrição Detalhada</label>
                    <textarea id="os-descricao" rows="2" placeholder="Detalhes técnicos, procedimentos de segurança..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500"></textarea>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Prioridade *</label>
                        <select id="os-prioridade" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                            <option value="Crítica">Crítica</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tipo de Serviço *</label>
                        <select id="os-tipo" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                            <option value="Preventiva">Preventiva</option>
                            <option value="Corretiva">Corretiva</option>
                            <option value="Preditiva">Preditiva</option>
                            <option value="Melhoria">Melhoria</option>
                            <option value="Inspeção">Inspeção/5S</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Duração Prev. (h/tec)</label>
                        <input type="number" id="os-horas" step="0.5" min="0.5" value="8.0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Dia da Programação</label>
                        <select id="os-dia" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                            <option value="">Sem Dia (Backlog)</option>
                            <option value="segunda">Segunda-feira</option>
                            <option value="terca">Terça-feira</option>
                            <option value="quarta">Quarta-feira</option>
                            <option value="quinta">Quinta-feira</option>
                            <option value="sexta">Sexta-feira</option>
                            <option value="sabado">Sábado</option>
                            <option value="domingo">Domingo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Status do Processo</label>
                    <select id="os-status" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                        <option value="backlog">Backlog (Não Programado)</option>
                        <option value="programado">Programado</option>
                        <option value="andamento">Em Andamento</option>
                        <option value="aguardando">Aguardando Peças/Liberação</option>
                        <option value="concluido">Concluído / Finalizado</option>
                    </select>
                </div>

                <!-- Campo de Assinatura Digital -->
                <div class="border-t border-slate-800 pt-3">
                    <label class="block text-xs font-semibold text-slate-300 mb-2 flex justify-between items-center">
                        <span><i class="fa-solid fa-signature text-emerald-400 mr-1"></i> Assinatura do Responsável / Validador</span>
                        <button type="button" id="btn-clear-signature" class="text-[10px] text-rose-400 hover:underline">Limpar Assinatura</button>
                    </label>
                    <div class="bg-white rounded-lg p-1">
                        <canvas id="signature-pad" class="w-full h-28 border border-slate-300 rounded cursor-crosshair bg-white"></canvas>
                    </div>
                </div>

                <!-- Checklist Section -->
                <div class="border-t border-slate-800 pt-3">
                    <label class="block text-xs font-semibold text-slate-300 mb-2 flex justify-between items-center">
                        <span><i class="fa-solid fa-list-check text-sky-400 mr-1"></i> Checklist de Tarefas Internas</span>
                        <span id="checklist-modal-count" class="text-[10px] text-slate-400">0/0</span>
                    </label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="input-new-check-item" placeholder="Adicionar sub-tarefa..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                        <button type="button" id="btn-add-check-item" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-200 border border-slate-700">Adicionar</button>
                    </div>
                    <ul id="modal-checklist-items" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar"></ul>
                </div>

                <!-- Actions -->
                <div class="border-t border-slate-800 pt-4 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <button type="button" id="btn-delete-os" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-700/50 px-3 py-2 rounded-lg text-xs font-medium hidden transition">
                            <i class="fa-solid fa-trash mr-1"></i> Excluir
                        </button>
                        <button type="button" id="btn-print-os" class="bg-indigo-950/60 hover:bg-indigo-900/80 text-indigo-300 border border-indigo-700/50 px-3 py-2 rounded-lg text-xs font-medium hidden transition">
                            <i class="fa-solid fa-print mr-1"></i> Imprimir OS (PDF)
                        </button>
                    </div>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" id="btn-cancel-modal" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-xs font-medium transition border border-slate-700">Cancelar</button>
                        <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2 rounded-lg text-xs font-medium transition shadow-lg shadow-sky-600/20">Salvar Ordem</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Template para Impressão de PDF -->
    <div id="printable-os" class="hidden"></div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-sky-500/50 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 z-50 no-print">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-xs font-medium">Operação realizada com sucesso!</span>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <script>
        const firebaseConfig = {

        // Lista Predefinida de Técnicos

            "Murilo",

            "François",
            "Elan",
            "José Xavier"

        const DAYS_CONFIG = [
            { id: 'segunda', title: 'Segunda-feira', short: 'SEG' },
            { id: 'terca', title: 'Terça-feira', short: 'TER' },
            { id: 'quarta', title: 'Quarta-feira', short: 'QUA' },
            { id: 'quinta', title: 'Quinta-feira', short: 'QUI' },
            { id: 'sexta', title: 'Sexta-feira', short: 'SEX' },
            { id: 'sabado', title: 'Sábado', short: 'SAB' },
            { id: 'domingo', title: 'Domingo', short: 'DOM' }
        ];

        const STATUS_CONFIG = [
            { id: 'backlog', title: 'Backlog (Pendente)', short: 'BACKLOG' },
            { id: 'programado', title: 'Programado', short: 'PROG' },
            { id: 'andamento', title: 'Em Andamento', short: 'ANDAM' },
            { id: 'aguardando', title: 'Aguardando Peças', short: 'AGUARD' },
            { id: 'concluido', title: 'Concluído', short: 'CONC' }
        ];

        let orders = [];
        let currentView = 'semanal'; 
        let currentTecnicosExecucao = [];

        // Inicializar Checkboxes e Dropdowns de Técnicos
        function renderProgrammedTechniciansCheckboxes(selectedTecs = []) {
            const container = document.getElementById('tecnicos-programados-checkboxes');
            const selectPreset = document.getElementById('select-tec-preset');
            
            container.innerHTML = '';
            selectPreset.innerHTML = '<option value="">-- Selecionar da Lista --</option>';

            const selectedArray = Array.isArray(selectedTecs) 
                ? selectedTecs 
                : (selectedTecs ? selectedTecs.split(',').map(s => s.trim()) : []);

            PRESET_TECNICOS.forEach(nome => {
                // Preencher Checkboxes
                const isChecked = selectedArray.includes(nome);
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 cursor-pointer hover:border-sky-500/50 transition';
                label.innerHTML = `
                    <input type="checkbox" value="${nome}" ${isChecked ? 'checked' : ''} onchange="atualizarHHModal()" class="tec-programado-cb rounded border-slate-700 bg-slate-950 text-sky-500 focus:ring-0">
                    <span class="text-xs text-slate-200">${nome}</span>
                `;
                container.appendChild(label);

                // Preencher Select do Executante
                const optSel = document.createElement('option');
                optSel.value = nome;
                optSel.textContent = nome;
                selectPreset.appendChild(optSel);
            });
        }

        // Adicionar novo técnico à lista predefinida
        document.getElementById('btn-add-novo-tecnico-preset').addEventListener('click', () => {
            const input = document.getElementById('input-novo-tecnico-preset');
            const novoNome = input.value.trim();
            
            if (novoNome) {
                if (!PRESET_TECNICOS.includes(novoNome)) {
                    PRESET_TECNICOS.push(novoNome);
                    // Obter os atualmente marcados
                    const AtualmenteMarcados = getSelectedProgrammedTechnicians();
                    AtualmenteMarcados.push(novoNome);
                    
                    renderProgrammedTechniciansCheckboxes(AtualmenteMarcados);
                    populateTechniciansFilter();
                    input.value = '';
                    showToast(`Técnico "${novoNome}" adicionado!`);
                    atualizarHHModal();
                } else {
                    showToast("Técnico já existe na lista.", "info");
                }
            }
        });

        // Retorna array dos técnicos programados selecionados
        function getSelectedProgrammedTechnicians() {
            const checkboxes = document.querySelectorAll('.tec-programado-cb:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Retorna a quantidade real de executantes para a OS
        function getOSExecutantesCount(os) {
            if (os.tecnicosExec && os.tecnicosExec.length > 0) {
                return os.tecnicosExec.length;
            }
            if (Array.isArray(os.tecnicoProgramado)) {
                return os.tecnicoProgramado.length;
            }
            if (os.tecnicoProgramado && typeof os.tecnicoProgramado === 'string') {
                return os.tecnicoProgramado.split(',').filter(Boolean).length;
            }
            return 0;
        }

        // Ao selecionar uma opção do dropdown no formulário de executantes
        document.getElementById('select-tec-preset').addEventListener('change', (e) => {
            if (e.target.value) {
                document.getElementById('input-tec-nome').value = e.target.value;
            }
        });

        // Toast de Notificação
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            } else if (type === 'danger') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Canvas de Assinatura
        let canvas, ctx, isDrawing = false;

        function initSignaturePad() {
            canvas = document.getElementById('signature-pad');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 112;

            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', (e) => { startDrawing(e.touches[0]); e.preventDefault(); });
            canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDrawing() { isDrawing = false; }

        function clearSignature() {
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function getSignatureData() {
            if (!canvas) return '';
            const blank = document.createElement('canvas');
            blank.width = canvas.width;
            blank.height = canvas.height;
            return canvas.toDataURL() === blank.toDataURL() ? '' : canvas.toDataURL();
        }

        function loadSignatureData(dataUrl) {
            clearSignature();
            if (dataUrl && ctx) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = dataUrl;
            }
        }

        function updateConnectionUI(online, isLocalFallback = false) {
            isOnline = online;
            const badge = document.getElementById('status-cloud-badge');
            const dot = document.getElementById('status-cloud-dot');
            const icon = document.getElementById('status-cloud-icon');
            const text = document.getElementById('status-cloud-text');
            const modeText = document.getElementById('status-mode-text');
            const modeBadge = document.getElementById('status-mode-badge');

            if (online && !isLocalFallback) {
                badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                icon.className = "fa-solid fa-cloud text-[11px]";
                text.textContent = "Nuvem Conectada";
                modeBadge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-sky-950 text-sky-300 border border-sky-700/80";
                modeText.textContent = "Modo Nuvem (Firestore)";
            } else {
                badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/30";
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                icon.className = "fa-solid fa-cloud-slash text-[11px]";
                text.textContent = "Sem Conexão Nuvem";
                modeBadge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-950 text-amber-300 border border-amber-700/80";
                modeText.textContent = "Modo Local (Offline)";
            }
        }

        function saveLocalOrders(data) { localStorage.setItem('pcm_orders_backup', JSON.stringify(data)); }
        function loadLocalOrders() { const data = localStorage.getItem('pcm_orders_backup'); return data ? JSON.parse(data) : []; }

        function initFirebaseRealtimeListener() {
            ordersRef.onSnapshot((snapshot) => {
                updateConnectionUI(navigator.onLine && !snapshot.metadata.hasPendingWrites);
                orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                saveLocalOrders(orders);
                renderBoard();
            }, (error) => {
                updateConnectionUI(false, true);
                orders = loadLocalOrders();
                renderBoard();
            });
        }

        async function saveOrderToCloud(osData) {
            try {
                const { id, ...dataToSave } = osData;
                if (id) {
                    if (isOnline) await ordersRef.doc(id).set(dataToSave, { merge: true });
                    const idx = orders.findIndex(o => o.id === id);
                    if (idx !== -1) orders[idx] = { id, ...dataToSave };
                } else {
                    if (isOnline) {
                        const newDoc = await ordersRef.add(dataToSave);
                        orders.push({ id: newDoc.id, ...dataToSave });
                    } else {
                        orders.push({ id: 'local_' + Date.now(), ...dataToSave });
                    }
                }
                saveLocalOrders(orders);
                renderBoard();
                showToast("Ordem de serviço salva com sucesso!");
            } catch (err) {
                saveLocalOrders(orders);
                renderBoard();
                showToast("Salvo localmente (offline)", "info");
            }
        }

        async function deleteOrderFromCloud(id) {
            if (!id) return;
            if (confirm("Tem certeza que deseja excluir esta Ordem de Serviço?")) {
                try {
                    if (isOnline && !id.startsWith('local_')) {
                        await ordersRef.doc(id).delete();
                    }
                    orders = orders.filter(o => o.id !== id);
                    saveLocalOrders(orders);
                    renderBoard();
                    closeModal();
                    showToast("Ordem de serviço excluída!", "danger");
                } catch (err) {
                    console.error("Erro ao excluir:", err);
                    showToast("Erro ao excluir OS", "danger");
                }
            }
        }

        // CONFIGURAÇÕES VISUAIS
        function getPriorityBadgeClass(p) {
            switch (p) {
                case 'Crítica': return 'bg-rose-950/80 text-rose-400 border-rose-600/80';
                case 'Alta': return 'bg-amber-950/80 text-amber-400 border-amber-600/80';
                case 'Média': return 'bg-sky-950/80 text-sky-400 border-sky-600/80';
                default: return 'bg-slate-800 text-slate-300 border-slate-600';
            }
        }

        function getTipoManutencaoColorClass(tipo) {
            switch (tipo) {
                case 'Corretiva': return 'text-rose-500 font-bold';
                case 'Melhoria': return 'text-emerald-400 font-bold';
                case 'Preventiva': return 'text-sky-400 font-bold';
                case 'Preditiva': return 'text-purple-400 font-bold';
                case 'Inspeção':
                case 'Inspeção/5S': return 'text-amber-400 font-bold';
                default: return 'text-slate-300 font-semibold';
            }
        }

        // CÁLCULO REAL DE HH USADO NA ORDEM DE SERVIÇO
        function getOSHomemHora(os) {
            const horasBase = parseFloat(os.horas) || 0;
            if (os.tecnicosExec && os.tecnicosExec.length > 0) {
                return os.tecnicosExec.reduce((acc, tec) => {
                    return acc + calcularHorasTecnico(tec, horasBase);
                }, 0);
            }
            
            // Se não houver apontamentos individuais, multiplica pelo número de técnicos programados
            const numProgramados = getOSExecutantesCount(os);
            return numProgramados > 0 ? (horasBase * numProgramados) : horasBase;
        }

        function getFilteredOrders() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const tecnico = document.getElementById('filter-tecnico').value;
            const prioridade = document.getElementById('filter-prioridade').value;
            const tipo = document.getElementById('filter-tipo').value;

            return orders.filter(os => {
                const tecsString = (os.tecnicosExec || []).map(t => t.nome).join(' ').toLowerCase();
                const tecProgString = Array.isArray(os.tecnicoProgramado) 
                    ? os.tecnicoProgramado.join(' ').toLowerCase()
                    : (os.tecnicoProgramado || '').toLowerCase();

                const matchSearch = !search || 
                    (os.numero && os.numero.toLowerCase().includes(search)) || 
                    (os.tag && os.tag.toLowerCase().includes(search)) || 
                    (os.titulo && os.titulo.toLowerCase().includes(search)) || 
                    tecsString.includes(search) ||
                    tecProgString.includes(search);
                
                const matchTecnico = !tecnico || 
                    (Array.isArray(os.tecnicoProgramado) ? os.tecnicoProgramado.includes(tecnico) : os.tecnicoProgramado === tecnico) ||
                    (os.tecnicosExec && os.tecnicosExec.some(t => t.nome === tecnico));
                
                const matchPrioridade = !prioridade || os.prioridade === prioridade;
                const matchTipo = !tipo || os.tipo === tipo;

                return matchSearch && matchTecnico && matchPrioridade && matchTipo;
            });
        }

        function populateTechniciansFilter() {
            const select = document.getElementById('filter-tecnico');
            const currentValue = select.value;
            
            let allTecs = [...PRESET_TECNICOS];
            orders.forEach(o => {
                if (o.tecnicoProgramado) {
                    if (Array.isArray(o.tecnicoProgramado)) {
                        allTecs.push(...o.tecnicoProgramado);
                    } else {
                        allTecs.push(o.tecnicoProgramado);
                    }
                }
                if (o.tecnicosExec && Array.isArray(o.tecnicosExec)) {
                    allTecs.push(...o.tecnicosExec.map(t => t.nome));
                }
            });
            const tecs = [...new Set(allTecs)].sort();
            select.innerHTML = '<option value="">Todos os Técnicos</option>';
            tecs.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                select.appendChild(opt);
            });
            select.value = currentValue;
        }

        function updateGlobalKPIs() {
            const filtered = getFilteredOrders();
            const totalProg = filtered.length;
            const totalConc = filtered.filter(o => o.status === 'concluido').length;
            const totalPend = filtered.filter(o => o.status !== 'concluido').length;
            const totalHH = filtered.reduce((acc, curr) => acc + getOSHomemHora(curr), 0);
            const aderencia = totalProg > 0 ? Math.round((totalConc / totalProg) * 100) : 0;

            document.getElementById('kpi-global-prog').textContent = totalProg;
            document.getElementById('kpi-global-conc').textContent = totalConc;
            document.getElementById('kpi-global-pend').textContent = totalPend;
            document.getElementById('kpi-global-horas').textContent = totalHH.toFixed(1) + ' HH';
            document.getElementById('kpi-global-efic').textContent = aderencia + '%';
        }

        // Widget Resumo da Coluna Semanal
        function renderDaySummaryWidget(colOrders) {
            const prog = colOrders.length;
            const conc = colOrders.filter(o => o.status === 'concluido').length;
            const pend = colOrders.filter(o => o.status !== 'concluido').length;
            
            const totalHH = colOrders.reduce((acc, curr) => acc + getOSHomemHora(curr), 0);
            const concHH = colOrders.filter(o => o.status === 'concluido').reduce((acc, curr) => acc + getOSHomemHora(curr), 0);
            const taxa = prog > 0 ? Math.round((conc / prog) * 100) : 0;

            return `
                <div class="bg-slate-950/80 border border-slate-800/90 rounded-xl p-3 mb-2 shadow-inner">
                    <div class="grid grid-cols-3 gap-1 text-center mb-2.5">
                        <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-1.5">
                            <span class="block text-[9px] font-bold text-slate-400 tracking-wider">PROG.</span>
                            <span class="text-sm font-extrabold text-sky-400">${prog}</span>
                        </div>
                        <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-1.5">
                            <span class="block text-[9px] font-bold text-slate-400 tracking-wider">CONC.</span>
                            <span class="text-sm font-extrabold text-emerald-400">${conc}</span>
                        </div>
                        <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-1.5">
                            <span class="block text-[9px] font-bold text-slate-400 tracking-wider">PEND.</span>
                            <span class="text-sm font-extrabold text-amber-500">${pend}</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between text-[11px] font-semibold mb-1.5">
                        <span class="text-slate-300">
                            Carga HH: <strong class="text-indigo-400 font-extrabold">${concHH.toFixed(1)} HH</strong> / ${totalHH.toFixed(1)} HH
                        </span>
                        <span class="text-sky-400 font-bold">${taxa}% Taxa</span>
                    </div>

                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-sky-500 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: ${taxa}%"></div>
                    </div>
                </div>
            `;
        }

        function renderBoard() {
            populateTechniciansFilter();
            updateGlobalKPIs();
            const container = document.getElementById('board-container');
            container.innerHTML = '';
            const filteredOrders = getFilteredOrders();

            if (currentView === 'semanal') {
                DAYS_CONFIG.forEach(day => {
                    const colOrders = filteredOrders.filter(o => o.dia === day.id);
                    container.innerHTML += `
                        <div class="w-80 flex-shrink-0 bg-slate-900/60 border border-slate-800/80 rounded-xl flex flex-col max-h-[calc(100vh-160px)]">
                            <div class="p-3 border-b border-slate-800 bg-slate-900 rounded-t-xl sticky top-0 z-10 flex items-center justify-between">
                                <h2 class="font-bold text-slate-200 text-sm flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>${day.title}
                                </h2>
                                <span class="text-xs bg-slate-800 text-slate-300 font-bold px-2.5 py-0.5 rounded-full border border-slate-700/80 shadow-sm">${colOrders.length} OS</span>
                            </div>
                            
                            <div class="p-2 space-y-2 overflow-y-auto flex-1 custom-scrollbar kanban-dropzone" data-day="${day.id}">
                                ${renderDaySummaryWidget(colOrders)}
                                ${colOrders.map(os => renderCardHTML(os, day.short)).join('')}
                            </div>
                        </div>`;
                });
            } else {
                STATUS_CONFIG.forEach(status => {
                    const colOrders = filteredOrders.filter(o => o.status === status.id);
                    container.innerHTML += `
                        <div class="w-80 flex-shrink-0 bg-slate-900/60 border border-slate-800/80 rounded-xl flex flex-col max-h-[calc(100vh-160px)]">
                            <div class="p-3 border-b border-slate-800 bg-slate-900 rounded-t-xl sticky top-0 z-10 flex items-center justify-between">
                                <h2 class="font-bold text-slate-200 text-sm">${status.title}</h2>
                                <span class="text-xs bg-slate-800 text-slate-300 font-semibold px-2 py-0.5 rounded-full border border-slate-700">${colOrders.length}</span>
                            </div>
                            <div class="p-2 space-y-3 overflow-y-auto flex-1 custom-scrollbar kanban-dropzone" data-status="${status.id}">
                                ${colOrders.map(os => renderCardHTML(os, status.short)).join('')}
                            </div>
                        </div>`;
                });
            }
            attachDragAndDrop();
        }

        function renderCardHTML(os, tagDireita) {
            const tecs = (os.tecnicosExec && os.tecnicosExec.length > 0) ? os.tecnicosExec : [];
            const tecsCount = getOSExecutantesCount(os);
            const hhTotalOS = getOSHomemHora(os);
            
            const checklist = os.checklist || [];
            const totalCheck = checklist.length;
            const doneCheck = checklist.filter(c => c.done).length;
            const percentCheck = totalCheck > 0 ? Math.round((doneCheck / totalCheck) * 100) : 0;
            
            const dayObj = DAYS_CONFIG.find(d => d.id === os.dia);
            const badgeTag = tagDireita || (dayObj ? dayObj.short : 'N/A');

            const tecProgTexto = Array.isArray(os.tecnicoProgramado)
                ? os.tecnicoProgramado.join(', ')
                : (os.tecnicoProgramado || '');

            return `
                <div draggable="true" data-id="${os.id}" onclick="openModalForEdit('${os.id}')" class="os-card bg-[#111827] border border-slate-800 hover:border-sky-500/80 rounded-xl p-3.5 shadow-lg cursor-pointer group transition-all duration-200 hover:shadow-sky-950/20">
                    
                    <!-- Linha 1: OS ID e Prioridade Badge -->
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-extrabold text-sky-400 tracking-wide font-mono">${os.numero}</span>
                        <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded border ${getPriorityBadgeClass(os.prioridade)}">${os.prioridade}</span>
                    </div>

                    <!-- Linha 2: Equipamento / Tag -->
                    <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-400 mb-1">
                        <i class="fa-solid fa-cube text-[11px] text-slate-500"></i>
                        <span class="truncate">${os.tag || 'Sem Tag / Área'}</span>
                    </div>

                    <!-- Linha 3: Título da Atividade -->
                    <h3 class="text-xs font-extrabold text-white tracking-tight uppercase leading-snug mb-2 line-clamp-2">${os.titulo}</h3>

                    <!-- Linha 4: Técnico Programado/Designado -->
                    ${tecProgTexto ? `
                        <div class="flex items-center gap-1.5 text-xs font-medium text-amber-300/90 mb-2 bg-amber-950/30 border border-amber-800/40 px-2 py-1 rounded-md">
                            <i class="fa-solid fa-user-gear text-[11px] text-amber-400"></i>
                            <span class="truncate font-semibold">Téc. Prog: ${tecProgTexto}</span>
                        </div>
                    ` : ''}

                    <!-- Linha 5: Quantidade de Executantes e Soma Total HH Usado -->
                    <div class="flex items-center justify-between text-xs text-slate-400 mb-2 bg-slate-900/80 p-1.5 rounded-lg border border-slate-800/60">
                        <span class="flex items-center gap-1.5 font-medium text-slate-300">
                            <i class="fa-solid fa-users text-sky-400 text-[11px]"></i>
                            <strong class="text-sky-300 font-bold">${tecsCount}</strong> Executante(s)
                        </span>
                        <span class="font-bold text-indigo-400 text-xs">
                            <i class="fa-regular fa-clock text-[11px] mr-1"></i>${hhTotalOS.toFixed(1)} HH Total
                        </span>
                    </div>

                    <!-- Linha 6: Executantes Apontados -->
                    ${tecs.length > 0 ? `
                        <div class="flex flex-wrap gap-1.5 mb-3">
                            ${tecs.map(t => `<span class="bg-slate-800/90 text-slate-200 text-[10px] font-medium px-2 py-0.5 rounded border border-slate-700/80"><i class="fa-solid fa-user-check text-[9px] text-emerald-400 mr-1"></i>${t.nome}</span>`).join('')}
                        </div>
                    ` : ''}

                    <!-- Linha 7: Checklist / Progresso -->
                    ${totalCheck > 0 ? `
                        <div class="mb-3 space-y-1">
                            <div class="flex justify-between text-[10px] font-semibold text-slate-400">
                                <span>Checklist</span>
                                <span>${doneCheck}/${totalCheck} (${percentCheck}%)</span>
                            </div>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-sky-500 h-full rounded-full transition-all duration-300" style="width: ${percentCheck}%"></div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Linha 8: Rodapé com Tipo e Tag -->
                    <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <span class="${getTipoManutencaoColorClass(os.tipo)}">${os.tipo}</span>
                        <span class="bg-slate-800 text-slate-300 border border-slate-700/80 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${badgeTag}</span>
                    </div>

                </div>`;
        }

        function attachDragAndDrop() {
            document.querySelectorAll('.os-card').forEach(card => {
                card.addEventListener('dragstart', e => {
                    e.stopPropagation();
                    e.dataTransfer.setData('text/plain', card.dataset.id);
                });
            });
            document.querySelectorAll('.kanban-dropzone').forEach(zone => {
                zone.addEventListener('dragover', e => e.preventDefault());
                zone.addEventListener('drop', async e => {
                    e.preventDefault();
                    const id = e.dataTransfer.getData('text/plain');
                    const os = orders.find(o => o.id === id);
                    if (!os) return;
                    if (zone.dataset.day) os.dia = zone.dataset.day;
                    if (zone.dataset.status) os.status = zone.dataset.status;
                    await saveOrderToCloud(os);
                });
            });
        }

        // CÁLCULOS DE HH
        function calcularHorasTecnico(tecnico, horasOSPadrao) {
            if (tecnico.inicio && tecnico.fim) {
                const inicio = new Date(tecnico.inicio);
                const fim = new Date(tecnico.fim);
                const diffMs = fim - inicio;
                if (diffMs > 0) {
                    return diffMs / (1000 * 60 * 60);
                }
            }
            return parseFloat(horasOSPadrao) || 0;
        }

        function atualizarHHModal() {
            const horasEstimadasOS = parseFloat(document.getElementById('os-horas').value) || 0;
            const programados = getSelectedProgrammedTechnicians();
            
            let totalExecutantes = 0;
            let hhTotal = 0;

            if (currentTecnicosExecucao.length > 0) {
                totalExecutantes = currentTecnicosExecucao.length;
                currentTecnicosExecucao.forEach(t => {
                    hhTotal += calcularHorasTecnico(t, horasEstimadasOS);
                });
            } else {
                totalExecutantes = programados.length;
                hhTotal = horasEstimadasOS * totalExecutantes;
            }

            document.getElementById('executantes-count-badge').textContent = `${totalExecutantes} Executantes`;
            document.getElementById('hh-preview-modal').textContent = `${hhTotal.toFixed(1)} HH Totais`;
        }

        function renderTecnicosExecucao() {
            const container = document.getElementById('tecnicos-execucao-container');
            container.innerHTML = '';
            const horasEstimadasOS = parseFloat(document.getElementById('os-horas').value) || 0;

            if (currentTecnicosExecucao.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-500 italic block text-center py-2">Nenhum técnico executante apontado individualmente. O número de executantes e HH padrão serão calculados com base nos Técnicos Programados.</span>';
            } else {
                currentTecnicosExecucao.forEach((t, index) => {
                    const inicioFormat = t.inicio ? new Date(t.inicio).toLocaleString('pt-BR') : 'Tempo Padrão';
                    const fimFormat = t.fim ? new Date(t.fim).toLocaleString('pt-BR') : 'Tempo Padrão';
                    const hhTecnico = calcularHorasTecnico(t, horasEstimadasOS);

                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-xs';
                    div.innerHTML = `
                        <div class="flex-1">
                            <div class="flex items-center justify-between mr-3">
                                <span class="font-bold text-sky-400 flex items-center gap-1.5"><i class="fa-solid fa-user text-[10px]"></i> ${t.nome}</span>
                                <span class="text-[11px] font-mono font-semibold text-indigo-300 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">${hhTecnico.toFixed(1)} HH</span>
                            </div>
                            <span class="text-[10px] text-slate-400 block mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${inicioFormat} até ${fimFormat}</span>
                        </div>
                        <button type="button" onclick="removeTecnicoExec(${index})" class="text-rose-400 hover:text-rose-300 p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    container.appendChild(div);
                });
            }

            atualizarHHModal();
        }

        document.getElementById('os-horas').addEventListener('input', atualizarHHModal);

        document.getElementById('btn-add-tecnico-exec').addEventListener('click', () => {
            const nomeInput = document.getElementById('input-tec-nome');
            const inicioInput = document.getElementById('input-tec-inicio');
            const fimInput = document.getElementById('input-tec-fim');

            if (nomeInput.value.trim()) {
                currentTecnicosExecucao.push({
                    nome: nomeInput.value.trim(),
                    inicio: inicioInput.value,
                    fim: fimInput.value
                });
                nomeInput.value = '';
                document.getElementById('select-tec-preset').value = '';
                inicioInput.value = '';
                fimInput.value = '';
                renderTecnicosExecucao();
            } else {
                showToast("Por favor, selecione ou informe o nome do técnico.", "info");
            }
        });

        function removeTecnicoExec(index) {
            currentTecnicosExecucao.splice(index, 1);
            renderTecnicosExecucao();
        }

        function openModalForCreate() {
            document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-plus-circle text-sky-400"></i> Cadastrar Nova Ordem de Serviço';
            document.getElementById('form-os').reset();
            document.getElementById('os-id').value = '';
            
            renderProgrammedTechniciansCheckboxes([]);
            
            document.getElementById('select-tec-preset').value = '';
            document.getElementById('btn-delete-os').classList.add('hidden');
            document.getElementById('btn-print-os').classList.add('hidden');
            document.getElementById('os-numero').value = `OS-2026-${String(orders.length + 1).padStart(2, '0')}`;
            currentTecnicosExecucao = [];
            currentTempChecklist = [];
            renderTecnicosExecucao();
            renderModalChecklist();
            clearSignature();
            document.getElementById('modal-os').classList.remove('hidden');
            setTimeout(initSignaturePad, 100);
        }

        function openModalForEdit(id) {
            const os = orders.find(o => o.id === id);
            if (!os) return;

            document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-file-pen text-sky-400"></i> Editar Ordem de Serviço';
            document.getElementById('os-id').value = os.id;
            document.getElementById('os-numero').value = os.numero;
            document.getElementById('os-tag').value = os.tag || '';
            
            renderProgrammedTechniciansCheckboxes(os.tecnicoProgramado || []);
            
            document.getElementById('os-titulo').value = os.titulo;
            document.getElementById('os-descricao').value = os.descricao || '';
            document.getElementById('os-prioridade').value = os.prioridade;
            document.getElementById('os-tipo').value = os.tipo;
            document.getElementById('os-horas').value = os.horas;
            document.getElementById('os-dia').value = os.dia || '';
            document.getElementById('os-status').value = os.status;
            document.getElementById('select-tec-preset').value = '';

            document.getElementById('btn-delete-os').classList.remove('hidden');
            document.getElementById('btn-print-os').classList.remove('hidden');

            currentTecnicosExecucao = os.tecnicosExec || [];
            currentTempChecklist = os.checklist || [];

            renderTecnicosExecucao();
            renderModalChecklist();
            document.getElementById('modal-os').classList.remove('hidden');
            setTimeout(() => {
                initSignaturePad();
                loadSignatureData(os.assinatura || '');
            }, 100);
        }

        function closeModal() { document.getElementById('modal-os').classList.add('hidden'); }

        function renderModalChecklist() {
            const list = document.getElementById('modal-checklist-items');
            list.innerHTML = '';
            let countDone = 0;
            currentTempChecklist.forEach((item, index) => {
                if (item.done) countDone++;
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded border border-slate-800 text-xs';
                li.innerHTML = `
                    <label class="flex items-center gap-2 cursor-pointer flex-1">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheckItem(${index})" class="rounded border-slate-700 bg-slate-900 text-sky-500">
                        <span class="${item.done ? 'line-through text-slate-500' : 'text-slate-200'}">${item.title}</span>
                    </label>
                    <button type="button" onclick="removeCheckItem(${index})" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button>`;
                list.appendChild(li);
            });
            document.getElementById('checklist-modal-count').textContent = `${countDone}/${currentTempChecklist.length}`;
        }

        function toggleCheckItem(i) { currentTempChecklist[i].done = !currentTempChecklist[i].done; renderModalChecklist(); }
        function removeCheckItem(i) { currentTempChecklist.splice(i, 1); renderModalChecklist(); }

        document.getElementById('btn-add-check-item').addEventListener('click', () => {
            const input = document.getElementById('input-new-check-item');
            if (input.value.trim()) {
                currentTempChecklist.push({ id: Date.now().toString(), title: input.value.trim(), done: false });
                input.value = '';
                renderModalChecklist();
            }
        });

        document.getElementById('btn-clear-signature').addEventListener('click', clearSignature);

        document.getElementById('form-os').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('os-id').value;
            const osData = {
                id: id || null,
                numero: document.getElementById('os-numero').value,
                tag: document.getElementById('os-tag').value.trim(),
                tecnicoProgramado: getSelectedProgrammedTechnicians(),
                tecnicosExec: [...currentTecnicosExecucao],
                titulo: document.getElementById('os-titulo').value,
                descricao: document.getElementById('os-descricao').value,
                prioridade: document.getElementById('os-prioridade').value,
                tipo: document.getElementById('os-tipo').value,
                horas: parseFloat(document.getElementById('os-horas').value) || 1,
                dia: document.getElementById('os-dia').value,
                status: document.getElementById('os-status').value,
                checklist: currentTempChecklist,
                assinatura: getSignatureData()
            };

            await saveOrderToCloud(osData);
            closeModal();
        });

        // Impressão da OS em PDF
        function printOS(id) {
            const os = orders.find(o => o.id === (id || document.getElementById('os-id').value));
            if (!os) return;

            const printArea = document.getElementById('printable-os');
            const totalHH = getOSHomemHora(os);

            const tecProgTexto = Array.isArray(os.tecnicoProgramado) 
                ? os.tecnicoProgramado.join(', ') 
                : (os.tecnicoProgramado || 'N/A');

            const tecsHtml = (os.tecnicosExec && os.tecnicosExec.length > 0) 
                ? os.tecnicosExec.map(t => {
                    const hh = calcularHorasTecnico(t, os.horas);
                    return `
                        <tr>
                            <td style="border: 1px solid #ddd; padding: 8px;">${t.nome}</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">${t.inicio ? new Date(t.inicio).toLocaleString('pt-BR') : 'N/A'}</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">${t.fim ? new Date(t.fim).toLocaleString('pt-BR') : 'N/A'}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: right;"><strong>${hh.toFixed(1)} HH</strong></td>
                        </tr>
                    `;
                }).join('') 
                : `<tr><td colspan="4" style="border: 1px solid #ddd; padding: 8px; text-align: center;">Programado para: ${tecProgTexto} (Sem apontamento individual)</td></tr>`;

            const checkHtml = (os.checklist && os.checklist.length > 0)
                ? os.checklist.map(c => `<li>[${c.done ? 'X' : ' '}] ${c.title}</li>`).join('')
                : '<li>Nenhuma sub-tarefa cadastrada</li>';

            printArea.innerHTML = `
                <div style="font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; color: #333;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; padding-bottom: 10px; margin-bottom: 20px;">
                        <div>
                            <h1 style="margin: 0; color: #0284c7; font-size: 24px;">ORDEM DE SERVIÇO</h1>
                            <p style="margin: 2px 0 0 0; color: #666;">PCM Pro - Relatório de Manutenção</p>
                        </div>
                        <div style="text-align: right;">
                            <h2 style="margin: 0; font-size: 20px;">${os.numero}</h2>
                            <p style="margin: 2px 0 0 0; font-size: 12px; color: #666;">Data de Emissão: ${new Date().toLocaleDateString('pt-BR')}</p>
                        </div>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                        <tr>
                            <td style="padding: 8px; border: 1px solid #ddd; width: 50%;"><strong>Título:</strong> ${os.titulo}</td>
                            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Equipamento / Tag:</strong> ${os.tag || 'N/A'}</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Téc. Programado:</strong> ${tecProgTexto}</td>
                            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Tipo / Prioridade:</strong> ${os.tipo} / ${os.prioridade}</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Status:</strong> ${os.status.toUpperCase()}</td>
                            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Total HH Usado:</strong> ${totalHH.toFixed(1)} HH (${os.horas}h prev/tec)</td>
                        </tr>
                    </table>

                    <div style="margin-bottom: 20px;">
                        <h3 style="border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #0284c7;">Descrição da Atividade</h3>
                        <p style="background: #f9f9f9; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">${os.descricao || 'Sem descrição cadastrada.'}</p>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <h3 style="border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #0284c7;">Técnicos e Apontamento de Execução</h3>
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #f0f0f0;">
                                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Técnico</th>
                                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Início</th>
                                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Fim</th>
                                    <th style="border: 1px solid #ddd; padding: 8px; text-align: right;">Horas Usadas</th>
                                </tr>
                            </thead>
                            <tbody>${tecsHtml}</tbody>
                        </table>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <h3 style="border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #0284c7;">Checklist de Verificação</h3>
                        <ul style="list-style-type: none; padding-left: 5px;">${checkHtml}</ul>
                    </div>

                    <div style="margin-top: 40px; display: flex; justify-between: space-between; align-items: flex-end;">
                        <div style="text-align: center; width: 45%;">
                            <div style="border-bottom: 1px solid #000; margin-bottom: 5px; height: 60px; display: flex; align-items: flex-end; justify-content: center;">
                                ${os.assinatura ? `<img src="${os.assinatura}" style="max-height: 60px;" />` : ''}
                            </div>
                            <p style="margin: 0; font-size: 12px;">Assinatura do Responsável / Técnico</p>
                        </div>
                        <div style="text-align: center; width: 45%;">
                            <div style="border-bottom: 1px solid #000; margin-bottom: 5px; height: 60px;"></div>
                            <p style="margin: 0; font-size: 12px;">Visto do Supervisor / Validação</p>
                        </div>
                    </div>
                </div>
            `;

            printArea.classList.remove('hidden');
            window.print();
            printArea.classList.add('hidden');
        }

        // Exportação para CSV
        function exportToCSV() {
            if (orders.length === 0) {
                showToast("Nenhuma OS disponível para exportar", "info");
                return;
            }
            let csv = 'Numero;Tag;Tecnico_Programado;Titulo;Prioridade;Tipo;Status;Horas_Previstas;Total_HH_Usado;Dia;Executantes\n';
            orders.forEach(o => {
                const tecs = (o.tecnicosExec || []).map(t => t.nome).join(' | ');
                const totalHH = getOSHomemHora(o);
                const tecProg = Array.isArray(o.tecnicoProgramado) ? o.tecnicoProgramado.join(' | ') : (o.tecnicoProgramado || '');
                csv += `"${o.numero}";"${o.tag || ''}";"${tecProg}";"${o.titulo}";"${o.prioridade}";"${o.tipo}";"${o.status}";"${o.horas}";"${totalHH.toFixed(1)}";"${o.dia || ''}";"${tecs}"\n`;
            });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `relatorio_os_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast("Relatório CSV gerado com sucesso!");
        }

        // Exportação JSON (Backup)
        function exportToJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(orders, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_pcm_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Backup JSON exportado!");
        }

        // Importação JSON
        function importFromJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = async function(e) {
                try {
                    const importedOrders = JSON.parse(e.target.result);
                    if (Array.isArray(importedOrders)) {
                        for (const item of importedOrders) {
                            await saveOrderToCloud(item);
                        }
                        showToast("Importação realizada com sucesso!");
                    } else {
                        showToast("Arquivo JSON inválido", "danger");
                    }
                } catch (err) {
                    showToast("Erro ao ler o arquivo JSON", "danger");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        // Eventos dos Botões da Interface
        document.getElementById('btn-delete-os').addEventListener('click', () => {
            const id = document.getElementById('os-id').value;
            deleteOrderFromCloud(id);
        });

        document.getElementById('btn-print-os').addEventListener('click', () => printOS());
        document.getElementById('btn-nova-os').addEventListener('click', openModalForCreate);
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

        document.getElementById('btn-export-csv').addEventListener('click', exportToCSV);
        document.getElementById('btn-export-json').addEventListener('click', exportToJSON);
        document.getElementById('input-import-json').addEventListener('change', importFromJSON);

        // Botões de Abas
        const tabSemanal = document.getElementById('tab-semanal');
        const tabStatus = document.getElementById('tab-status');

        tabSemanal.addEventListener('click', () => {
            currentView = 'semanal';
            tabSemanal.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-2 bg-sky-600 text-white shadow";
            tabStatus.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-2 text-slate-400 hover:text-white";
            renderBoard();
        });

        tabStatus.addEventListener('click', () => {
            currentView = 'status';
            tabStatus.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-2 bg-sky-600 text-white shadow";
            tabSemanal.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-2 text-slate-400 hover:text-white";
            renderBoard();
        });

        // Eventos de Filtro
        document.getElementById('filter-search').addEventListener('input', renderBoard);
        document.getElementById('filter-tecnico').addEventListener('change', renderBoard);
        document.getElementById('filter-prioridade').addEventListener('change', renderBoard);
        document.getElementById('filter-tipo').addEventListener('change', renderBoard);

        document.getElementById('btn-limpar-filtros').addEventListener('click', () => {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-tecnico').value = '';
            document.getElementById('filter-prioridade').value = '';
            document.getElementById('filter-tipo').value = '';
            renderBoard();
        });

        window.onload = function() {
            renderProgrammedTechniciansCheckboxes([]);
            updateConnectionUI(navigator.onLine);
            initFirebaseRealtimeListener();
        };
    </script>
</body>
</html>
